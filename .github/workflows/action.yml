name: Leak secret

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret
  cancel-in-progress: true


jobs:
  on-machine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pyecho
        env:
          KEY: ${{ secrets.TEST }}
        run: python main.py

      - name: echo
        env:
          KEY: ${{ secrets.TEST }}
        run: |
          echo "${KEY:0:${#KEY}}";
          echo "${KEY:0:${#KEY}/2}";
          rev <<< KEY;
